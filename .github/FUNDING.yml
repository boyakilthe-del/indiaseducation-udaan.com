<!DOCTYPE html>
<html>
<head>
    <title>Political Story</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 50px;
        }

        .box {
            width: 30%;
            padding: 20px;
            background: white;
            border-radius: 10px;
        
    

        .bjp { background-color: orange; }
        .congress { background-color: lightgreen; }
    </style>
</head>

<body>

<h1>Education & Jobs Debate</h1>

<div class="container">
    
    <div class="box">
        <h2>BJP</h2>
        <p>Focus on development, skills, and new opportunities.</p>
        <button class="bjp" onclick="support('BJP')">Support BJP</button>
    </div>

    <div class="box center">
        <h2>Politician</h2>
        <p>Trying to balance education and job opportunities for youth
    </
        <p>Focus on education reforms and employment support.</p>
        <button class="congress" onclick="support('Congress')">Support Congress</button>
    </div>

</div>

<p id="result"></p>

<script>
function support(party) {
    document.getElementById("result").innerHTML =
        "You supported " + party + ". Now think about education and jobs!";
}
</script>

</body>
